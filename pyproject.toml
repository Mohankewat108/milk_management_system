[project]
name = "dairynexus"
version = "0.1.0"
description = "Multi-tenant dairy operations SaaS"
requires-python = ">=3.12"
readme = "README.md"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "*_tests.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
