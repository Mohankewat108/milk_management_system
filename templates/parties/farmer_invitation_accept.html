{% extends "base.html" %}
{% block title %}Activate farmer account{% endblock %}
{% block content %}<section class="panel" style="max-width:560px;margin:2rem auto"><h1>Activate your farmer account</h1><p>Welcome, <strong>{{ farmer.full_name }}</strong>. Set your password to access your farmer portal.</p>{% if error %}<p class="alert error" role="alert">{{ error }}</p>{% endif %}<form method="post" class="form-layout">{% csrf_token %}<label for="password">Password</label><input type="password" id="password" name="password" required autocomplete="new-password"><label for="confirm_password">Confirm password</label><input type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password"><button class="button" type="submit">Activate account</button></form></section>{% endblock %}
