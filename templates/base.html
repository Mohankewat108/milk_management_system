<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}DairyNexus{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{% url 'dashboard' %}">DairyNexus</a>
        {% if user.is_authenticated %}
        <nav>
            <a href="{% url 'dashboard' %}">Dashboard</a>
            <a href="{% url 'customer_list' %}">Customers</a>
            <a href="{% url 'collection_list' %}">Milk Collections</a>
            <a href="{% url 'farmer_list' %}">Farmers</a>
            <a href="{% url 'staff_list' %}">Staff</a>
            <a href="{% url 'inventory_list' %}">Inventory</a>
            <a href="{% url 'support_list' %}">Support</a>
            <a href="{% url 'customer_portal' %}">Customer portal</a>
            <a href="{% url 'platform_dashboard' %}">Platform</a>
            <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button type="submit">Logout</button></form>
        </nav>
        {% endif %}
    </header>
    <main class="container">
        {% if messages %}{% for message in messages %}<div class="alert">{{ message }}</div>{% endfor %}{% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
