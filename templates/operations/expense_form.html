{% extends 'base.html' %}{% block content %}
<h1>Record expense</h1><form method="post" class="form-card">{% csrf_token %}
<label>Branch<select name="branch" required>{% for branch in branches %}<option value="{{ branch.id }}">{{ branch.name }}</option>{% endfor %}</select></label>
<label>Category<input name="category" required></label><label>Amount<input type="number" name="amount" step="0.01" min="0.01" required></label>
<label>Expense date<input type="date" name="expense_date" value="{{ today }}" required></label>
<label>Vendor<input name="vendor"></label><label>Reference<input name="reference"></label><label>Notes<textarea name="notes"></textarea></label>
<button type="submit">Save expense</button></form>{% endblock %}
