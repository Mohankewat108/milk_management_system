{% extends 'base.html' %}
{% block title %}Add customer{% endblock %}
{% block content %}
<h1>Add customer</h1>
<form method="post" class="form-card">{% csrf_token %}
    <label>Name<input name="name" required></label>
    <label>Phone<input name="phone_number" required></label>
    <label>Email<input type="email" name="email"></label>
    <label>Branch<select name="branch" required><option value="">Select branch</option>{% for branch in branches %}<option value="{{ branch.id }}">{{ branch.name }}</option>{% endfor %}</select></label>
    <label>City<input name="city"></label><label>Village<input name="village"></label><label>Ward<input name="ward"></label>
    <button type="submit">Save customer</button>
</form>
{% endblock %}
