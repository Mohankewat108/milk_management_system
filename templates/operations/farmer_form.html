{% extends 'base.html' %}{% block content %}
<h1>Add farmer</h1><form method="post" class="form-card">{% csrf_token %}
<label>Name<input name="name" required></label><label>Phone<input name="phone_number" required></label>
<label>Branch<select name="branch" required>{% for branch in branches %}<option value="{{ branch.id }}">{{ branch.name }}</option>{% endfor %}</select></label>
<button type="submit">Save farmer</button></form>{% endblock %}
