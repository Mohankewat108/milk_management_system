{% extends 'base.html' %}{% block content %}
<div class="heading-row"><h1>Farmers</h1><a href="{% url 'farmer_create' %}">Add farmer</a></div>
<table><thead><tr><th>Name</th><th>Phone</th><th>Branch</th></tr></thead><tbody>
{% for farmer in farmers %}<tr><td>{{ farmer.name }}</td><td>{{ farmer.phone_number }}</td><td>{{ farmer.branch.name }}</td></tr>
{% empty %}<tr><td colspan="3">No farmers.</td></tr>{% endfor %}</tbody></table>{% endblock %}
