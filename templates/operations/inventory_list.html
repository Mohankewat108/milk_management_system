{% extends 'base.html' %}{% block content %}
<div class="heading-row"><h1>Inventory</h1></div>
<table><thead><tr><th>SKU</th><th>Name</th><th>Branch</th><th>Unit</th><th>Reorder level</th></tr></thead><tbody>
{% for item in items %}<tr><td>{{ item.sku }}</td><td>{{ item.name }}</td><td>{{ item.branch.name }}</td><td>{{ item.unit }}</td><td>{{ item.reorder_level }}</td></tr>
{% empty %}<tr><td colspan="5">No inventory items.</td></tr>{% endfor %}</tbody></table>{% endblock %}
