{% extends 'base.html' %}{% block content %}
<h1>Record payment</h1><form method="post" class="form-card">{% csrf_token %}
<label>Branch<select name="branch" required>{% for branch in branches %}<option value="{{ branch.id }}">{{ branch.name }}</option>{% endfor %}</select></label>
<label>Customer<select name="customer"><option value="">No customer</option>{% for customer in customers %}<option value="{{ customer.id }}">{{ customer.name }}</option>{% endfor %}</select></label>
<label>Amount<input type="number" name="amount" step="0.01" min="0.01" required></label>
<label>Payment date<input type="date" name="payment_date" value="{{ today }}" required></label>
<label>Method<select name="method"><option>cash</option><option>bank</option><option>mobile_money</option></select></label>
<label>Reference<input name="reference"></label><label>Notes<textarea name="notes"></textarea></label>
<button type="submit">Save payment</button></form>{% endblock %}
