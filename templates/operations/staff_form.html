{% extends 'base.html' %}{% block content %}
<h1>Add staff</h1><form method="post" class="form-card">{% csrf_token %}
<label>Username<input name="username" required></label><label>Email<input type="email" name="email"></label>
<label>First name<input name="first_name"></label><label>Temporary password<input type="password" name="password" value="ChangeMe123!"></label>
<label>Employee code<input name="employee_code" required></label>
<label>Branch<select name="branch" required>{% for branch in branches %}<option value="{{ branch.id }}">{{ branch.name }}</option>{% endfor %}</select></label>
<label>Role<select name="role">{% for value,label in roles %}<option value="{{ value }}">{{ label }}</option>{% endfor %}</select></label>
<button type="submit">Create staff</button></form>{% endblock %}
