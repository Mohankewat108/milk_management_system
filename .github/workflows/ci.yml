
name: DairyNexus CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "ui/**"
      - "hardening/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dairynexus-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  django:
    name: Django / PostgreSQL / Redis
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dairynexus_test
          POSTGRES_USER: dairynexus
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dairynexus -d dairynexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DATABASE_URL: postgres://dairynexus:test-only-password@127.0.0.1:5432/dairynexus_test
      REDIS_URL: redis://127.0.0.1:6379/0
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_SITE_URL: https://example.invalid
      EMAIL_HOST: smtp.example.invalid
      EMAIL_PORT: "587"
      EMAIL_HOST_USER: ci@example.invalid
      EMAIL_HOST_PASSWORD: ci-only-password
      DEFAULT_FROM_EMAIL: ci@example.invalid

    steps:
      # Use the GitHub-generated merge commit for pull requests.
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/development.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/development.txt
          python -m pip install ruff bandit pip-audit

      # Static code quality
      - name: Ruff lint
        run: ruff check .

      - name: Ruff format verification
        run: ruff format --check .

      # Django migration verification.
      # Never generate migrations in CI.
      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run

      # Actual PostgreSQL migration test.
      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Check for unapplied migrations
        run: python manage.py showmigrations --plan

      # Application checks
      - name: Django system checks
        run: python manage.py check

      - name: Django production deployment checks
        run: python manage.py check --deploy --settings=config.settings.production

      # Automated tests
      - name: Run test suite with branch coverage
        run: coverage run --branch manage.py test --verbosity 2

      - name: Generate coverage reports
        if: always()
        run: |
          coverage report
          coverage xml -o coverage.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: django-coverage
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14

      # Security checks
      - name: Bandit security scan
        run: bandit -r apps config -ll

      - name: Dependency vulnerability audit
        run: pip-audit

