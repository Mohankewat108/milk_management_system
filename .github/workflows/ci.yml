name: DairyNexus CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: dairynexus-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: dairynexus_test
          POSTGRES_USER: dairynexus
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dairynexus -d dairynexus_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DATABASE_URL: postgres://dairynexus:test-only-password@127.0.0.1:5432/dairynexus_test
      REDIS_URL: redis://127.0.0.1:6379/0
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/development.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt
          pip install pip-audit
      - name: Generate migrations in ephemeral CI workspace
        run: python manage.py makemigrations --noinput
      - name: Validate generated migration graph
        run: python manage.py makemigrations --check --dry-run
      - name: Apply migrations on PostgreSQL
        run: python manage.py migrate --noinput
      - name: Django system checks
        run: python manage.py check
      - name: Run tests with branch coverage
        run: coverage run --branch manage.py test --verbosity 2
      - name: Publish coverage summary
        run: coverage report
      - name: Dependency vulnerability audit
        run: pip-audit
      - name: Commit generated initial migrations to this PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          find apps -path '*/migrations/0*.py' -print0 | xargs -0 -r git add
          if ! git diff --cached --quiet; then
            git commit -m 'Add generated initial Django migrations'
            git push origin HEAD:"$GITHUB_HEAD_REF"
          else
            echo 'No generated migrations to commit.'
          fi
