services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dairynexus
      POSTGRES_USER: dairynexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-this}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dairynexus -d dairynexus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    user: "0:0"
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_DEBUG: "true"
      DATABASE_URL: postgresql://dairynexus:${POSTGRES_PASSWORD:-local-only-change-this}@db:5432/dairynexus
      REDIS_URL: redis://redis:6379/0
      DJANGO_USE_REDIS_CACHE: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      DJANGO_SESSION_COOKIE_SECURE: "false"
      DJANGO_CSRF_COOKIE_SECURE: "false"
    command: >
      sh -c "python manage.py makemigrations --noinput &&
             python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - private_uploads:/app/private_uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  private_uploads:
